# ============================================
# InterviewMentorAI — 双容器编排（Python 单后端 + Flutter Web）
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================

services:
  # ── Python Agent 后端（唯一后端：业务 + AI + MCP 工具层） ──
  python-ai:
    build: ./backend_python
    container_name: mentor-python
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3.5-omni-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SQLITE_DB_PATH: /app/data/interview.db
      # 生产必须注入强随机密钥（openssl rand -hex 32）；未设置时回落开发默认值（不安全）
      JWT_SECRET: ${JWT_SECRET:-interview-mentor-dev-secret-change-me}
    ports:
      - "8000:8000"
    volumes:
      - python_data:/app/data
      - ./backend_python/data/rag_docs:/app/data/rag_docs
      # 本地模型缓存（离线预置到 backend_python/models/hf_cache，随代码分发，无需容器联网下载）
      - ./backend_python/models:/app/models

  # ── Flutter Web 前端（nginx 伺服） ──
  flutter-web:
    build:
      context: ./frontend_flutter
      args:
        # 生产构建把 API/WS 基址注入 Web 前端（同源走 nginx 反代，见 frontend_flutter/nginx.conf）
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    container_name: mentor-flutter
    restart: unless-stopped
    depends_on:
      python-ai:
        condition: service_started
    ports:
      - "80:80"

volumes:
  python_data: