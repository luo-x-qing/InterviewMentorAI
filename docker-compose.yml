# ============================================
# InterviewMentorAI — 双容器编排（Python 单后端 + Flutter Web）
# 启动: docker-compose up -d
# 停止: docker-compose down
# ============================================
version: "3.9"

services:
  # ── Python Agent 后端（唯一后端：业务 + AI + MCP 工具层） ──
  python-ai:
    build: ./backend_python
    container_name: mentor-python
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3.5-omni-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SQLITE_DB_PATH: /app/data/interview.db
    ports:
      - "8000:8000"
    volumes:
      - python_data:/app/data
      - ./backend_python/data/rag_docs:/app/data/rag_docs

  # ── Flutter Web 前端（nginx 伺服） ──
  flutter-web:
    build: ./frontend_flutter
    container_name: mentor-flutter
    restart: unless-stopped
    depends_on:
      python-ai:
        condition: service_started
    ports:
      - "80:80"

volumes:
  python_data: