server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

spring:
  application:
    name: interview-mentor-ai
  # H2???
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/interview_db
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# ????????????????SpringAI???
llm:
  api-key: ${LLM_API_KEY:sk-xxx}
  base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
  model-name: deepseek-chat
  temperature: 0.3

# Whisper???????OpenAI?????
asr:
  api-key: ${ASR_API_KEY:sk-xxx}
  base-url: ${ASR_BASE_URL:https://api.openai.com/v1}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.interview.mentor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl