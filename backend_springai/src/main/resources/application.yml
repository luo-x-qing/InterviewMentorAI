server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

spring:
  application:
    name: interview-mentor-ai-java
  # H2数据库配置
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/interview_db
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Python AI 后端配置
python:
  ai:
    backend:
      url: ${PYTHON_AI_BACKEND_URL:http://localhost:8000}

# 音频文件存储配置
audio:
  storage:
    path: ./data/audio

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.interview.mentor.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
