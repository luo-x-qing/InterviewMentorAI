server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB

spring:
  application:
    name: interview-mentor-ai-java

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/interview_mentor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

python:
  ai:
    backend:
      url: ${PYTHON_AI_BACKEND_URL:http://localhost:8000}
      connect-timeout: 10000
      read-timeout: 120000

audio:
  storage:
    path: ${AUDIO_STORAGE_PATH:./data/audio}

jwt:
  secret: ${JWT_SECRET:InterviewMentorAI-2026-Super-Secret-Key-At-Least-256-Bits-Long}
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

async:
  core-pool-size: 4
  max-pool-size: 8
  queue-capacity: 50
  thread-name-prefix: ai-analysis-
  keep-alive-seconds: 60

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.interview.mentor.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.interview.mentor: DEBUG
    org.springframework.security: DEBUG
